name: Tests

on:
  push:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: money_plan

jobs:
  js-lint:
    name: JS lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: money_plan/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: money_plan/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:js

  css-lint:
    needs: js-lint
    name: CSS lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: money_plan/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: money_plan/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:css

  js-test:
    needs: css-lint
    name: JS test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: money_plan/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: money_plan/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:js:coverage

  ruff:
    needs: js-test
    name: Ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
      - run: uvx ruff@0.16.10 check .
      - run: uvx ruff@0.16.10 format --check .

  pytest:
    needs: ruff
    name: Pytest + coverage
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: money_plan
          POSTGRES_USER: debug
          POSTGRES_PASSWORD: debug
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U debug"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://debug:debug@localhost:5432/money_plan
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: money_plan/uv.lock
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev gettext
      - run: uv sync --frozen
      # Compile before pytest starts so Django never caches an empty Thai catalog
      - run: uv run --no-sync python manage.py compilemessages --ignore .venv --ignore node_modules
      - run: uv run --no-sync coverage run -m pytest -p no:sugar -ra
      - run: uv run --no-sync coverage report --show-missing
