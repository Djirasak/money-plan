volumes:
  money_plan_local_postgres_data: {}
  money_plan_local_postgres_data_backups: {}
  money_plan_local_redis_data: {}
  money_plan_local_seaweedfs_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: money_plan_local_django
    container_name: money_plan_local_django
    depends_on:
      - postgres
      - redis
      - node
      - seaweedfs
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: money_plan_production_postgres
    container_name: money_plan_local_postgres
    volumes:
      - money_plan_local_postgres_data:/var/lib/postgresql/18/docker
      - money_plan_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false

  redis:
    image: docker.io/redis:7.2
    container_name: money_plan_local_redis
    volumes:
      - money_plan_local_redis_data:/data

  celeryworker:
    <<: *django
    image: money_plan_local_celeryworker
    container_name: money_plan_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: money_plan_local_celerybeat
    container_name: money_plan_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: money_plan_local_flower
    container_name: money_plan_local_flower
    ports:
      - '5556:5556'
    command: /start-flower

  node:
    build:
      context: .
      dockerfile: ./compose/local/node/Dockerfile
    image: money_plan_local_node
    container_name: money_plan_local_node
    volumes:
      - .:/app:z
      # http://jdlm.info/articles/2016/03/06/lessons-building-node-app-docker.html
      - /app/node_modules
    command: npm run dev

  # S3-compatible object storage (attachments). Master/volume/filer/S3 all in one process.
  # Host ports are bound to 127.0.0.1 only and picked to avoid common clashes:
  #   9333 master UI · 8888 filer UI · 8333 S3 API
  # The volume server (8080) stays internal to the compose network on purpose.
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.48
    container_name: money_plan_local_seaweedfs
    command: >
      server -dir=/data -master.volumeSizeLimitMB=1024
      -filer -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - money_plan_local_seaweedfs_data:/data
      - ./compose/local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro,z
    ports:
      - '127.0.0.1:9333:9333'
      - '127.0.0.1:8888:8888'
      - '127.0.0.1:8333:8333'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9333/cluster/status']
      interval: 10s
      timeout: 3s
      retries: 5
