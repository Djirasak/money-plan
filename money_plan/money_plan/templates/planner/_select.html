{% load i18n planner_tags %}
{% comment %}
  Basecoat select (custom listbox). Needs: name, field_id, options=[(value, label)], selected, label.
  Optional: auto_submit (submit the surrounding form on change).
{% endcomment %}
<div class="select w-full" id="{{ field_id }}" {% if auto_submit %}data-auto-submit{% endif %}>
  <button type="button" class="btn w-full justify-between font-normal" data-variant="outline" id="{{ field_id }}-trigger" aria-haspopup="listbox"
          aria-expanded="false" aria-controls="{{ field_id }}-listbox" aria-label="{{ label }}">
    <span class="truncate">{% for value, text in options %}{% if value|stringformat:"s" == selected|stringformat:"s" %}{{ text }}{% endif %}{% endfor %}</span>
    {% icon "chevron-down" "size-4 shrink-0 opacity-80" %}
  </button>
  <div id="{{ field_id }}-popover" data-popover aria-hidden="true">
    <div role="listbox" id="{{ field_id }}-listbox" aria-orientation="vertical" aria-labelledby="{{ field_id }}-trigger">
      {% for value, text in options %}
        <div role="option" data-value="{{ value }}" {% if value|stringformat:"s" == selected|stringformat:"s" %}aria-selected="true"{% endif %}>{{ text }}</div>
      {% endfor %}
    </div>
  </div>
  <input type="hidden" name="{{ name }}" value="{{ selected }}" />
</div>
