{# One labelled form field with its inline errors. Pass f=<bound field>. #}
<div class="grid gap-2">
  <label class="label" id="{{ f.id_for_label }}-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
  {{ f }}
  {% for error in f.errors %}<p class="text-xs font-medium text-destructive">{{ error }}</p>{% endfor %}
</div>
