{% extends "base.html" %}
{% load planner_tags %}
{% block main %}
  <header class="mb-5 flex items-center gap-3">
    <div class="grid size-12 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-violet-500 text-white shadow-lg shadow-brand-500/30">
      <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 7h10M5 12h7M5 17h4"/><circle cx="17" cy="16" r="2" fill="currentColor"/></svg>
    </div>
    <div class="min-w-0 flex-1">
      <p class="text-xs font-semibold uppercase tracking-[0.2em] text-brand-500">Money Plan</p>
      <h1 class="truncate text-2xl font-bold">{% block heading %}{% endblock heading %}</h1>
    </div>
    {% if months %}
      <form method="get" class="shrink-0">
        <select name="m" onchange="this.form.submit()" aria-label="เดือน"
                class="rounded-2xl border-0 bg-white py-3 pl-4 pr-8 text-sm font-semibold shadow-sm">
          {% for m in months %}<option value="{{ m }}" {% if m == month %}selected{% endif %}>{{ m|thai_month }}</option>{% endfor %}
        </select>
      </form>
    {% endif %}
    <a href="{{ request.get_full_path }}" aria-label="รีเฟรช"
       class="grid size-12 shrink-0 place-items-center rounded-full bg-white text-brand-600 shadow-sm">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
    </a>
  </header>
  {% block page %}{% endblock page %}
  <nav class="fixed inset-x-0 bottom-4 z-10 mx-auto flex w-[calc(100%-2rem)] max-w-md rounded-full bg-white/95 p-2 shadow-[0_10px_40px_rgba(60,60,120,0.18)] backdrop-blur">
    {% for key, label, url, icon in nav %}
      <a href="{{ url }}{% if month and key != 'settings' %}?m={{ month }}{% endif %}"
         class="flex flex-1 flex-col items-center gap-0.5 rounded-full py-2 text-xs font-semibold {% if key == active %}bg-brand-50 text-brand-600{% else %}text-slate-500{% endif %}">
        <span class="text-xl leading-none">{{ icon }}</span>{{ label }}
      </a>
    {% endfor %}
  </nav>
{% endblock main %}
