{% load planner_tags %}
{% load i18n %}
{# Action bar: "+" (add new) on the left, save icon on the right. Pass add_href to show "+". #}
<div class="flex items-center justify-between pt-1">
  {% if add_href %}
    <a href="{{ add_href }}" aria-label="{% trans "Add new" %}" title="{% trans "Add new" %}" class="icon-btn">
      {% icon "plus" "size-6" %}
    </a>
  {% else %}
    <span></span>
  {% endif %}
  <button type="submit" aria-label="{{ save_label|default:_("Save") }}" title="{{ save_label|default:_("Save") }}" class="icon-btn-primary">
    {% icon "save" "size-6" %}
  </button>
</div>
