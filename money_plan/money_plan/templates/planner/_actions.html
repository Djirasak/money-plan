{% load i18n %}
{# Action bar: "+" (add new) on the left, save icon on the right. Pass add_href to show "+". #}
<div class="flex items-center justify-between pt-1">
  {% if add_href %}
    <a href="{{ add_href }}" aria-label="{% trans "Add new" %}" title="{% trans "Add new" %}" class="icon-btn">
      <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  {% else %}
    <span></span>
  {% endif %}
  <button type="submit" aria-label="{{ save_label|default:_("Save") }}" title="{{ save_label|default:_("Save") }}" class="icon-btn-primary">
    <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
  </button>
</div>
