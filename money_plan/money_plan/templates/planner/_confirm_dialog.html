{% load i18n %}
{# Shared "are you sure" dialog. Buttons with data-confirm-delete data-delete-id data-delete-name fill and open it. #}
<dialog id="confirm-delete" class="modal !max-w-sm" aria-labelledby="confirm-delete-title">
  <form method="post" class="flex flex-col gap-4">
    {% csrf_token %}
    <input type="hidden" name="action" value="{{ action }}" />
    <input type="hidden" name="id" value="" data-delete-field />
    <h2 class="text-xl font-bold" id="confirm-delete-title">{{ title }}</h2>
    <p class="text-muted"><strong data-delete-label></strong></p>
    {% if note %}<p class="text-sm text-muted">{{ note }}</p>{% endif %}
    <div class="flex flex-col gap-2">
      <button type="submit" class="btn !from-rose-700 !to-rose-700" data-loading-text="{% trans 'Delete' %}">{% trans "Delete" %}</button>
      <button type="button" class="btn-soft" data-close-dialog>{% trans "Cancel" %}</button>
    </div>
  </form>
</dialog>
