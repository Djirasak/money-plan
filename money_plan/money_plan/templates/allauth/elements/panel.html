{% load allauth %}

<section class="rounded-lg border bg-muted/40 p-4">
  <h2 class="mb-2 text-sm font-medium">{% slot title %}{% endslot %}</h2>
  {% slot body %}{% endslot %}
  {% if slots.actions %}
    <ul class="mt-3 flex flex-col gap-2">
      {% for action in slots.actions %}<li>{{ action }}</li>{% endfor %}
    </ul>
  {% endif %}
</section>
