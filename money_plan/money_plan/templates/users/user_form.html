{% extends "base.html" %}

{% block title %}
  {{ user.username }}
{% endblock title %}
{% block content %}
  <form class="card space-y-4" method="post" action="{% url 'users:update' %}">
    <h1 class="text-2xl font-bold">{{ user.username }}</h1>
    {% csrf_token %}
    {% load allauth %}
    <div class="auth auth-fields space-y-4">
      {% for field in form %}
        <div>
          <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="mt-1 text-sm text-danger">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
    </div>
    <button type="submit" class="btn">Update</button>
  </form>
{% endblock content %}
