{% extends "base.html" %}

{% block title %}
  {{ user.username }}
{% endblock title %}
{% block content %}
  <form class="card" data-size="sm" method="post" action="{% url 'users:update' %}">
    {% csrf_token %}
    <header class="px-4"><h1 class="text-base font-semibold">{{ user.username }}</h1></header>
    <section class="auth-fields flex flex-col gap-4 px-4">
      {% for field in form %}
        <div class="grid gap-2">
          <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="text-xs font-medium text-destructive">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
    </section>
    <footer class="justify-end px-4">
      <button type="submit" class="btn">Update</button>
    </footer>
  </form>
{% endblock content %}
