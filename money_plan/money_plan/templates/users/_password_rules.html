{% load i18n planner_tags %}
{# Live checklist for the new-password field. project.js sets data-state (ok / bad / idle) on each item. #}
<div class="grid gap-1.5" data-password-rules data-mismatch-text="{% trans 'The two passwords do not match.' %}"
     data-ok-text="{% trans 'met' %}" data-bad-text="{% trans 'not met' %}">
  <ul class="password-rules">
    {% for rule in rules %}
      <li data-rule="length" data-min="{{ rule.min }}" data-state="idle">
        <span class="rule-icon rule-ok" aria-hidden="true">{% icon "check" "size-3.5" %}</span>
        <span class="rule-icon rule-bad" aria-hidden="true">{% icon "x" "size-3.5" %}</span>
        <span class="rule-icon rule-idle" aria-hidden="true">{% icon "circle" "size-3.5" %}</span>
        <span>{{ rule.text }}</span>
        <span class="sr-only" data-rule-status></span>
      </li>
    {% endfor %}
  </ul>
</div>
